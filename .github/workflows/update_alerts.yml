name: Actualizar Alertas y Desplegar Dashboard 24/7

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar Alertas Mundiales en Vivo
        run: |
          python scripts/fetch_alerts.py

      - name: Guardar cambios si hay nuevas alertas
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/alerts.json static/data/alerts.json static/js/alerts_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Nuevas alertas alimentarias mundiales detectadas [skip ci]" && git push)

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
